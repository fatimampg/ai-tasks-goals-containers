name: CI

on:
    push:
        branches: [ main ]

jobs:
    build-and-test: 
        runs-on: ubuntu-latest

        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BCRYPT_SALT_ROUNDS: ${{ secrets.BCRYPT_SALT_ROUNDS }}
          REACT_APP_URL: ${{ secrets.REACT_APP_URL }}
          REACT_APP_URL_LOCAL: "http://localhost:3000"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        
        steps:
            - name: Check repo
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            # FRONTEND:
            - name: Install dependencies (frontend)
              run: |
                cd frontend
                npm install
            
            - name: Build (frontend)
              run: |
                cd frontend
                npm run build

            - name: Run tests (frontend)
              run: |
                cd frontend
                npm test

            # BACKEND:
            - name: Install dependencies (backend)
              run: |
                cd backend
                npm install
            
            - name: Build (backend)
              run: |
                cd backend
                npm run build
            
            - name: Run tests (backend)
              run: |
                cd backend
                npm test

    build-and-push-docker:
        runs-on: ubuntu-latest
        needs: build-and-test
        
        steps:
            - name: Check repo
              uses: actions/checkout@v4

            - name: Install Docker Compose
              run: |
                  sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                  sudo chmod +x /usr/local/bin/docker-compose
                  docker-compose --version

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Create .env file for backend
              run: |
                echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ./backend/.env
                echo "BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS }}" >> ./backend/.env
                echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> ./backend/.env
                echo "REACT_APP_URL=${{ secrets.REACT_APP_URL }}" >> ./backend/.env                
                echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> ./backend/.env 

            - name: Create .env file for frontend
              run: |
                echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> ./frontend/.env

            # - name: Archive backend env file artifact
            #   uses: actions/upload-artifact@v4
            #   with:
            #     name: backend-env
            #     path: ./backend/.env

            # - name: Archive frontend env file artifact
            #   uses: actions/upload-artifact@v4
            #   with:
            #     name: frontend-env
            #     path: ./frontend/.env

      
            - name: Build and Push Docker image
              env:
                POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
              run: |
                docker-compose -f docker-compose.yml build
                docker-compose -f docker-compose.yml push

    # # E2E TESTS (CYPRESS):
    cypress-e2e-tests:
        runs-on: ubuntu-latest
        needs: build-and-push-docker

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Docker Compose
              run: |
                  sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                  sudo chmod +x /usr/local/bin/docker-compose
                  docker-compose --version
            
            # - name: Download backend env file (artifact)
            #   uses: actions/download-artifact@v4
            #   with:
            #     name: backend-env
            #     path: ./backend

            # - name: Download frontend env file (artifact)
            #   uses: actions/download-artifact@v4
            #   with:
            #     name: frontend-env
            #     path: ./frontend
            - name: Create .env file for backend
              run: |
                echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ./backend/.env
                echo "BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS }}" >> ./backend/.env
                echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> ./backend/.env
                echo "REACT_APP_URL=${{ secrets.REACT_APP_URL }}" >> ./backend/.env                
                echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> ./backend/.env 

            - name: Create .env file for frontend
              run: |
                echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> ./frontend/.env

            - name: Start Backend and Frontend (Docker)
              env:
                POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
              run: |
                docker-compose -f docker-compose.yml up -d
                docker-compose -f docker-compose.yml ps

            - name: Run E2E tests
              uses: cypress-io/github-action@v6
              with:
                wait-on: "http://localhost:3000"
            
            - name: Stop and clean Docker containers
              run: docker-compose -f docker-compose.yml down